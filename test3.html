<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Winzy - Explore New Horizons</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @keyframes spin-slow {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .animate-spin-slow {
            animation: spin-slow 10s linear infinite;
        }
        .glass {
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        body {
            background-color: #0a0a0a;
            color: white;
        }
    </style>
</head>
<body class="selection:bg-red-500 selection:text-white overflow-x-hidden">

    <!-- Background Image -->
    <div class="fixed inset-0 z-0">
        <img 
            src="https://images.unsplash.com/photo-1518780664697-55e3ad937233?auto=format&fit=crop&q=80&w=2000" 
            alt="Nature House"
            class="w-full h-full object-cover opacity-60 brightness-75 scale-105"
        />
        <div class="absolute inset-0 bg-gradient-to-b from-black/60 via-transparent to-black/80"></div>
    </div>

    <!-- Navigation -->
    <nav id="navbar" class="fixed top-0 left-0 right-0 z-50 transition-all duration-300 px-6 md:px-12 py-6 flex items-center justify-between">
        <div class="flex items-center gap-2">
            <div class="w-8 h-8 bg-red-500 rounded-lg flex items-center justify-center rotate-12">
                <svg class="w-5 h-5 text-white" fill="currentColor" viewBox="0 0 24 24">
                    <path d="M12 2L4.5 20.29l.71.71L12 18l6.79 3 .71-.71z" />
                </svg>
            </div>
            <span class="text-2xl font-bold tracking-tight">Winzy</span>
        </div>

        <div class="hidden lg:flex items-center gap-8 text-sm font-medium text-gray-300">
            <a href="#" class="hover:text-white transition-colors">Stays</a>
            <a href="#" class="hover:text-white transition-colors">Experiences</a>
            <a href="#" class="hover:text-white transition-colors">Blog</a>
            <a href="#" class="hover:text-white transition-colors">About</a>
            <a href="#" class="hover:text-white transition-colors">Become a Host</a>
        </div>

        <button class="bg-red-500 hover:bg-red-600 px-6 py-2.5 rounded-full font-semibold transition-transform active:scale-95 shadow-lg shadow-red-500/20">
            Get Started
        </button>
    </nav>

    <!-- Main Content -->
    <main class="relative z-10 pt-32 pb-20 px-6 md:px-12 min-h-screen flex flex-col justify-between">
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-12 items-center">
            
            <!-- Hero Left -->
            <div class="lg:col-span-7 space-y-8">
                <h1 class="text-5xl md:text-7xl font-bold leading-[1.1] max-w-2xl">
                    Explore New Horizons with Every Journey
                </h1>
                <p class="text-lg text-gray-300 max-w-md leading-relaxed">
                    Discover unique cultures, stunning landscapes, and unforgettable moments every step of the way.
                </p>
                
                <div class="flex items-center gap-4">
                    <button class="bg-white/10 hover:bg-white/20 backdrop-blur-md border border-white/20 px-8 py-4 rounded-full flex items-center gap-3 font-semibold transition-all group">
                        Get started
                        <div class="bg-white/10 p-1.5 rounded-full group-hover:bg-white group-hover:text-black transition-all">
                            <i data-lucide="arrow-up-right" class="w-4 h-4"></i>
                        </div>
                    </button>
                </div>
            </div>

            <!-- Hero Right - Destination Card -->
            <div class="lg:col-span-5 flex justify-end">
                <div class="w-full max-w-sm glass p-4 rounded-[2rem] shadow-2xl">
                    <div class="relative aspect-[4/3] rounded-2xl overflow-hidden mb-6">
                        <img 
                            src="https://images.unsplash.com/photo-1501785888041-af3ef285b470?auto=format&fit=crop&q=80&w=800" 
                            alt="Norway Cabin"
                            class="w-full h-full object-cover transition-transform duration-700 hover:scale-110"
                        />
                        <div class="absolute inset-0 bg-gradient-to-t from-black/40 to-transparent"></div>
                    </div>
                    
                    <div class="flex justify-between items-center mb-6 px-2">
                        <span class="text-sm font-medium text-gray-400">01/10</span>
                        <div class="flex gap-1.5 h-1 items-center flex-1 mx-4">
                            <div class="h-full w-1/3 bg-white rounded-full"></div>
                            <div class="h-full w-1/3 bg-white/20 rounded-full"></div>
                            <div class="h-full w-1/3 bg-white/20 rounded-full"></div>
                        </div>
                    </div>

                    <div class="px-2 pb-2">
                        <div class="flex items-start gap-4">
                            <span class="text-2xl font-bold text-white leading-none">Tour</span>
                            <p class="text-sm text-gray-300 leading-relaxed">
                                Explore Brazil with local flavors and guided adventures
                            </p>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Footer Info Row -->
        <div class="mt-12 lg:mt-0 flex flex-col md:flex-row items-center justify-between gap-8">
            
            <!-- User Stats -->
            <div class="flex items-center gap-4 bg-black/20 backdrop-blur-md p-2 pr-6 rounded-full border border-white/5">
                <div class="flex -space-x-3">
                    <img src="https://images.unsplash.com/photo-1539571696357-5a69c17a67c6?w=100&h=100&fit=crop" class="w-10 h-10 rounded-full border-2 border-[#1a1a1a] object-cover" />
                    <img src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=100&h=100&fit=crop" class="w-10 h-10 rounded-full border-2 border-[#1a1a1a] object-cover" />
                    <img src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=100&h=100&fit=crop" class="w-10 h-10 rounded-full border-2 border-[#1a1a1a] object-cover" />
                    <img src="https://images.unsplash.com/photo-1500648767791-00dcc994a43e?w=100&h=100&fit=crop" class="w-10 h-10 rounded-full border-2 border-[#1a1a1a] object-cover" />
                </div>
                <div class="text-sm">
                    <p class="font-bold">10K+ users</p>
                </div>
            </div>

            <!-- Rotating Explore Badge -->
            <div class="relative w-32 h-32 flex items-center justify-center">
                 <div class="absolute inset-0 flex items-center justify-center z-10">
                    <div class="w-10 h-10 bg-white/10 rounded-full flex items-center justify-center backdrop-blur-sm border border-white/20">
                        <div class="w-5 h-5 bg-red-500 rounded flex items-center justify-center rotate-12">
                             <svg class="w-3 h-3 text-white" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2L4.5 20.29l.71.71L12 18l6.79 3 .71-.71z" /></svg>
                        </div>
                    </div>
                 </div>
                <svg class="w-full h-full animate-spin-slow" viewBox="0 0 100 100">
                  <defs>
                    <path id="circlePath" d="M 50, 50 m -35, 0 a 35,35 0 1,1 70,0 a 35,35 0 1,1 -70,0" />
                  </defs>
                  <text fill="white" class="text-[7px] font-medium tracking-[0.2em] opacity-60 uppercase">
                    <textPath xlink:href="#circlePath">
                      Explore more • Explore more • Explore more •
                    </textPath>
                  </text>
                </svg>
            </div>

            <!-- Social Icons -->
            <div class="flex items-center gap-8">
                <span class="text-sm font-medium text-gray-400">Follow us</span>
                <div class="flex gap-4">
                    <a href="#" class="w-10 h-10 rounded-full border border-white/10 flex items-center justify-center hover:bg-white/10 transition-all text-gray-400 hover:text-white">
                        <i data-lucide="instagram" class="w-4 h-4"></i>
                    </a>
                    <a href="#" class="w-10 h-10 rounded-full border border-white/10 flex items-center justify-center hover:bg-white/10 transition-all text-gray-400 hover:text-white">
                        <i data-lucide="youtube" class="w-4 h-4"></i>
                    </a>
                    <a href="#" class="w-10 h-10 rounded-full border border-white/10 flex items-center justify-center hover:bg-white/10 transition-all text-gray-400 hover:text-white">
                        <i data-lucide="twitter" class="w-4 h-4"></i>
                    </a>
                </div>
            </div>
        </div>
    </main>

    <!-- Side Stats (Vertical Bar) -->
    <div class="fixed right-8 top-1/2 -translate-y-1/2 hidden xl:flex flex-col gap-8 z-20 items-center">
        <div class="flex flex-col items-center gap-1 group cursor-pointer">
            <div class="w-12 h-12 rounded-full border border-white/5 flex items-center justify-center backdrop-blur-sm group-hover:bg-white/10 transition-all text-gray-400 group-hover:text-white">
                <i data-lucide="heart" class="w-5 h-5"></i>
            </div>
            <span class="text-[10px] font-bold text-gray-500 uppercase tracking-widest">630</span>
        </div>
        <div class="flex flex-col items-center gap-1 group cursor-pointer">
            <div class="w-12 h-12 rounded-full border border-white/5 flex items-center justify-center backdrop-blur-sm group-hover:bg-white/10 transition-all text-gray-400 group-hover:text-white">
                <i data-lucide="message-circle" class="w-5 h-5"></i>
            </div>
            <span class="text-[10px] font-bold text-gray-500 uppercase tracking-widest">42</span>
        </div>
        <div class="flex flex-col items-center gap-1 group cursor-pointer">
            <div class="w-12 h-12 rounded-full border border-white/5 flex items-center justify-center backdrop-blur-sm group-hover:bg-white/10 transition-all text-gray-400 group-hover:text-white">
                <i data-lucide="share-2" class="w-5 h-5"></i>
            </div>
            <span class="text-[10px] font-bold text-gray-500 uppercase tracking-widest">14</span>
        </div>
    </div>

    <script>
        // Initialize Lucide Icons
        lucide.createIcons();

        // Navbar Scroll Effect
        const navbar = document.getElementById('navbar');
        window.addEventListener('scroll', () => {
            if (window.scrollY > 50) {
                navbar.classList.add('bg-black/40', 'backdrop-blur-md');
                navbar.classList.remove('py-6');
                navbar.classList.add('py-4');
            } else {
                navbar.classList.remove('bg-black/40', 'backdrop-blur-md');
                navbar.classList.add('py-6');
                navbar.classList.remove('py-4');
            }
        });
    </script>
</body>
</html>
