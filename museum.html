<!doctype html>
<html lang="en">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta charset="utf-8">
<title>Our Wedding Museum</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600&family=Marcellus&family=Pinyon+Script&display=swap">
<style>
/* Layout: full-bleed 3D gallery; glass HUD pinned to corners; paper invitation card as the intro */
:root{
  --paper:#f7f2e8;
  --ink:#2b2420;
  --gold:#a8843f;
  --glass:rgba(26,21,18,.64);
  --glass-line:rgba(255,246,230,.16);
  --on-glass:#f6efe3;
  --muted:#8a7f72;
  --f-script:"Pinyon Script","Snell Roundhand","Apple Chancery",cursive;
  --f-caps:"Marcellus",Georgia,"Times New Roman",serif;
  --f-ui:"Jost",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
[hidden]{display:none!important}
html,body{height:100%;overflow:hidden}
body{background:#1e1b19;color:var(--ink);font-family:var(--f-ui);touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;outline:none}
button{font:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,label:focus-within{outline:2px solid var(--gold);outline-offset:2px}

/* HUD */
.hud-top{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;gap:10px;
  padding-top:calc(env(safe-area-inset-top,0px) + 12px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));pointer-events:none;z-index:5}
.hud-top>*{pointer-events:auto}
.chip{background:var(--glass);border:1px solid var(--glass-line);color:var(--on-glass);border-radius:14px;padding:8px 14px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);min-width:0}
.chip .n{font-family:var(--f-script);font-size:26px;line-height:1.05;white-space:nowrap}
.chip .d{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#d8cbb6}
.hud-btns{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.gbtn{background:var(--glass);border:1px solid var(--glass-line);color:var(--on-glass);border-radius:999px;padding:9px 14px;font-size:13px;font-weight:500;letter-spacing:.02em;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);display:inline-flex;align-items:center;gap:8px}
.gbtn:hover{background:rgba(40,32,27,.78)}
kbd{font-family:var(--f-ui);font-size:11px;border:1px solid rgba(255,246,230,.5);border-radius:5px;padding:1px 6px;line-height:1.4}
.coarse kbd{display:none}

.hud-bottom{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:space-between;align-items:flex-end;gap:12px;
  padding-bottom:calc(env(safe-area-inset-bottom,0px) + 18px);
  padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));pointer-events:none;z-index:5}
.hud-bottom>*{pointer-events:auto}
#joy{width:124px;height:124px;border-radius:50%;background:rgba(26,21,18,.38);border:1px solid var(--glass-line);position:relative;touch-action:none;display:none}
.coarse #joy{display:block}
#knob{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;background:rgba(246,239,227,.85);box-shadow:0 4px 14px rgba(0,0,0,.3)}
#hint{color:var(--on-glass);font-size:12px;letter-spacing:.04em;background:var(--glass);border:1px solid var(--glass-line);border-radius:999px;padding:7px 12px}
.coarse #hint{display:none}
.right-actions{display:flex;flex-direction:column;align-items:flex-end;gap:10px}
#action{font-size:15px;padding:12px 18px;background:rgba(26,21,18,.78)}
#action[hidden]{display:none!important}

/* name tags */
.ntag{position:fixed;left:0;top:0;z-index:3;transform:translate(-50%,-100%);pointer-events:none;background:var(--glass);color:var(--on-glass);font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px;white-space:nowrap}
.ntag::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:#e9c46a;margin-right:6px;vertical-align:1px}
/* compact HUD on phones */
@media (max-width:560px){
  .chip{padding:6px 10px}
  .chip .n{font-size:21px}
  .chip .d{font-size:9px;letter-spacing:.1em;white-space:nowrap}
  .hud-btns{gap:6px}
  .gbtn{padding:7px 11px;font-size:12px}
}
#bubble{position:fixed;left:0;top:0;z-index:4;transform:translate(-50%,-100%);pointer-events:none;display:flex;flex-direction:column;align-items:center;gap:6px}
#bubble p{background:#fffdf8;color:var(--ink);font-size:15px;padding:9px 14px;border-radius:14px;box-shadow:0 6px 18px rgba(0,0,0,.22);max-width:240px;text-align:center;position:relative}
#bubble p::after{content:"";position:absolute;left:50%;bottom:-6px;margin-left:-6px;border:6px solid transparent;border-bottom:0;border-top-color:#fffdf8}
#bubble span{background:var(--glass);color:var(--on-glass);font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px}
#bubble span::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:#e9c46a;margin-right:6px;vertical-align:1px}

/* Overlays */
.overlay{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;overflow-y:auto;touch-action:pan-y;
  background:rgba(20,16,14,.52);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  padding-block:calc(env(safe-area-inset-top,0px) + 20px) calc(env(safe-area-inset-bottom,0px) + 20px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.card{background:var(--paper);color:var(--ink);width:100%;max-width:440px;margin:auto;padding:38px 30px 30px;text-align:center;position:relative;
  box-shadow:0 30px 80px rgba(0,0,0,.4);border-radius:4px}
.card::before{content:"";position:absolute;inset:10px;border:1px solid rgba(168,132,63,.55);pointer-events:none}
.card::after{content:"";position:absolute;inset:15px;border:1px solid rgba(168,132,63,.25);pointer-events:none}
.card .host{font-family:var(--f-caps);font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin:0}
.card h1{font-family:var(--f-script);font-weight:400;font-size:clamp(44px,13vw,62px);line-height:1.05;color:var(--gold);margin:14px 0 6px;text-wrap:balance}
.card h1 em{font-style:normal;font-size:.7em;padding:0 .12em}
.card .line{font-family:var(--f-caps);font-size:16px;margin:0 0 18px}
.rule{display:flex;align-items:center;gap:10px;margin:0 auto 18px;max-width:220px}
.rule::before,.rule::after{content:"";flex:1;height:1px;background:rgba(168,132,63,.6)}
.rule i{width:7px;height:7px;transform:rotate(45deg);background:var(--gold)}
.card .date{font-family:var(--f-caps);font-size:17px;letter-spacing:.12em;text-transform:uppercase;margin:0}
.card .time{font-size:14px;color:var(--muted);margin:4px 0 14px}
.card .venue{font-family:var(--f-caps);font-size:19px;margin:0}
.card .city{font-size:14px;color:var(--muted);margin:3px 0 0}
.card .count{display:inline-block;margin:18px 0 0;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);border:1px solid rgba(168,132,63,.5);padding:5px 12px;border-radius:999px;font-variant-numeric:tabular-nums}
.card .rsvp{font-size:13px;color:var(--muted);margin:12px 0 0}
.card .actions{display:flex;flex-direction:column;gap:10px;margin-top:24px;position:relative;z-index:1}
.pbtn{background:var(--ink);color:var(--paper);border:0;border-radius:999px;padding:13px 20px;font-size:15px;font-weight:500;letter-spacing:.04em}
.pbtn:hover{background:#40352f}
.tbtn{background:none;border:0;color:var(--ink);text-decoration:underline;text-underline-offset:3px;font-size:14px;padding:6px}
.card .note{font-size:12px;color:var(--muted);margin:14px 0 0}

/* Lightbox */
.lb{display:flex;flex-direction:column;align-items:center;gap:14px;max-width:min(92vw,520px);margin:auto}
.lb img{max-height:68vh;max-width:100%;border:12px solid #fffdf8;box-shadow:0 20px 60px rgba(0,0,0,.45);background:#fffdf8}
.lb .cap{color:var(--on-glass);font-family:var(--f-caps);font-size:20px;text-align:center}
.lb .num{color:#cbbfae;font-size:12px;letter-spacing:.16em;text-transform:uppercase}
.lb .row{display:flex;gap:10px}

/* Personalize sheet */
#sheet{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);box-sizing:border-box;z-index:25;background:var(--paper);color:var(--ink);overflow-y:auto;touch-action:pan-y;
  box-shadow:-20px 0 60px rgba(0,0,0,.35);-webkit-user-select:text;user-select:text;
  padding-block:calc(env(safe-area-inset-top,0px) + 18px) calc(env(safe-area-inset-bottom,0px) + 28px);
  padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.sh-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:6px}
.sh-head h2{font-family:var(--f-caps);font-weight:400;font-size:24px;margin:0}
.sh-sub{font-size:13px;color:var(--muted);margin:0 0 18px;line-height:1.5}
fieldset{border:0;border-top:1px solid rgba(168,132,63,.4);margin:0;padding:16px 0 20px;display:grid;gap:12px;min-width:0}
legend{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);padding-right:10px;font-weight:600}
.f{display:grid;gap:5px;min-width:0}
.f label{font-size:12px;color:var(--muted);font-weight:500}
.f input,.f select{font:inherit;font-size:15px;color:var(--ink);background:#fffdf8;border:1px solid #d9cfbf;border-radius:8px;padding:9px 11px;min-width:0;width:100%;box-sizing:border-box}
.f input[type=color]{padding:3px;height:40px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.photo-row{display:grid;grid-template-columns:62px 1fr;gap:12px;align-items:center}
.thumb{width:62px;height:78px;border-radius:4px;background:#e9e1d3 center/cover no-repeat;border:3px solid #fffdf8;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.pr-ctrl{display:grid;gap:6px;min-width:0}
.pr-btns{display:flex;gap:8px;flex-wrap:wrap}
.upl{position:relative;overflow:hidden;font-size:13px;border:1px solid #cbbfae;border-radius:999px;padding:5px 12px;background:#fffdf8;cursor:pointer}
.upl input{position:absolute;inset:0;opacity:0;cursor:pointer}
.mini{font-size:13px;border:0;background:none;color:var(--muted);text-decoration:underline;padding:5px 2px}
.warn{font-size:12px;color:#8a3a2a;margin:0}
.chk{display:flex;gap:10px;align-items:center;font-size:14px}
.chk input{width:18px;height:18px;accent-color:var(--ink)}
.sh-foot{display:flex;gap:10px;justify-content:space-between;align-items:center;padding-top:8px;flex-wrap:wrap}
/* invitation subtitle (birthday age, baby shower) */
.card .sub{font-family:var(--f-caps);font-size:15px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);margin:-2px 0 10px}
.card .rule::before,.card .rule::after{background:var(--gold);opacity:.6}
/* wishes form */
.card.wish{text-align:left}
.card.wish .host,.card.wish .wtitle{text-align:center}
.wtitle{font-family:var(--f-script);font-weight:400;font-size:46px;color:var(--gold);margin:6px 0 14px}
.card.wish .f{margin-bottom:12px;position:relative;z-index:1}
.f textarea{font:inherit;font-size:15px;color:var(--ink);background:#fffdf8;border:1px solid #d9cfbf;border-radius:8px;padding:9px 11px;width:100%;box-sizing:border-box;resize:vertical;-webkit-user-select:text;user-select:text}
.card.wish input{-webkit-user-select:text;user-select:text}
/* photo booth */
#photo{flex-direction:column;gap:14px}
.polaroid{background:#fffdf8;padding:12px 12px 18px;box-shadow:0 24px 70px rgba(0,0,0,.45);transform:rotate(-1.5deg);max-width:min(88vw,560px);margin-top:auto}
.polaroid img{display:block;width:100%;-webkit-touch-callout:default;-webkit-user-select:auto;user-select:auto}
.pcap{font-family:var(--f-script);font-size:34px;color:var(--ink);text-align:center;margin:10px 0 0}
.pdate{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);text-align:center;margin:2px 0 0}
.phint{color:var(--on-glass);font-size:13px;margin:0}
#photo .row{display:flex;gap:10px;margin-bottom:auto}
#flash{position:fixed;inset:0;z-index:30;background:#fffdf8;pointer-events:none;opacity:0}
#flash.go{animation:flash .65s ease-out}
@keyframes flash{0%{opacity:.95}100%{opacity:0}}
/* phones: one Menu button, compact controls, 16px inputs (no zoom on focus) */
#b-menu{display:none}
@media (max-width:640px){
  #b-menu{display:inline-flex;flex:none}
  .hud-btns{display:none;position:absolute;right:max(16px,env(safe-area-inset-right,0px));top:calc(env(safe-area-inset-top,0px) + 60px);flex-direction:column;align-items:stretch;gap:2px;
    background:rgba(26,21,18,.86);border:1px solid var(--glass-line);border-radius:16px;padding:6px;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);min-width:190px}
  .hud-btns.open{display:flex}
  .hud-btns .gbtn{background:transparent;border-color:transparent;justify-content:space-between;font-size:15px;padding:12px 14px;backdrop-filter:none;-webkit-backdrop-filter:none}
  .chip{max-width:calc(100vw - 130px);min-width:0}
  .chip .n{font-size:20px;overflow:hidden;text-overflow:ellipsis}
  .chip .d{font-size:9px;letter-spacing:.08em;overflow:hidden;text-overflow:ellipsis}
  #joy{width:112px;height:112px}
  .right-actions{gap:8px}
  .right-actions .gbtn:not(#action){padding:8px 13px;font-size:13px}
  #action{font-size:15px;padding:12px 18px}
  #bubble p{max-width:200px;font-size:14px}
  .ntag{font-size:11px}
  .f input,.f select,.f textarea{font-size:16px}
  .lb .row,#photo .row{flex-wrap:wrap;justify-content:center}
  .card{padding:30px 22px 24px}
  .wtitle{font-size:40px}
}
@media (max-height:480px) and (orientation:landscape){
  #joy{width:96px;height:96px}
  #knob{width:46px;height:46px;margin:-23px 0 0 -23px}
  .chip .d{display:none}
  .hud-btns{top:calc(env(safe-area-inset-top,0px) + 50px);max-height:calc(100vh - 70px);overflow-y:auto}
  .card{margin:6px auto}
  .lb img{max-height:52vh}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

</head>
<body>
<canvas id="c" tabindex="0" aria-label="Walkable 3D celebration museum"></canvas>

<div class="hud-top">
  <div class="chip" id="chip"><div class="n"></div><div class="d"></div></div>
  <button class="gbtn" id="b-menu" type="button" aria-expanded="false" aria-controls="hud-btns">Menu</button>
  <div class="hud-btns" id="hud-btns">
    <button class="gbtn" id="b-look" type="button">Painted <kbd>P</kbd></button>
    <button class="gbtn" id="b-time" type="button">Afternoon <kbd>T</kbd></button>
    <button class="gbtn" id="b-invite" type="button">Invitation</button>
    <button class="gbtn" id="b-edit" type="button">Personalize</button>
  </div>
</div>

<div id="bubble" hidden><p></p><span></span></div>

<div class="hud-bottom">
  <div>
    <div id="joy" aria-label="Move"><div id="knob"></div></div>
    <div id="hint">WASD to walk · drag to look · M music · P painted look · T time of day</div>
  </div>
  <div class="right-actions">
    <button class="gbtn" id="action" type="button" hidden><span></span><kbd>F</kbd></button>
    <button class="gbtn" id="b-music" type="button" aria-pressed="false">Music off <kbd>M</kbd></button>
    <button class="gbtn" id="b-dance" type="button">Dance <kbd>G</kbd></button>
  </div>
</div>

<div class="overlay" id="intro"></div>
<div class="overlay" id="invite" hidden></div>
<div class="overlay" id="lightbox" hidden>
  <div class="lb">
    <img id="lb-img" alt="">
    <div class="num" id="lb-num"></div>
    <div class="cap" id="lb-cap"></div>
    <div class="row">
      <button class="gbtn" id="lb-prev" type="button">Previous</button>
      <button class="gbtn" id="lb-close" type="button">Back to museum</button>
      <button class="gbtn" id="lb-next" type="button">Next</button>
    </div>
  </div>
</div>
<div class="overlay" id="wishbox" hidden></div>
<div class="overlay" id="photo" hidden></div>
<div id="flash" hidden></div>
<aside id="sheet" hidden aria-label="Personalize the museum"></aside>

{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.149.0/build/three.module.js",

</script>

<script>
window.startMuseum = function(){
'use strict';
const PHOTO_COUNT = 9;
const STORE = 'wedding-museum-v1';
const WISH_STORE = 'wedding-museum-wishes-v1';
let painted = false;

/* ---------- celebrations ---------- */
const THEMES = {
  wedding: {
    label:'Wedding', accent:'#a8843f', ink:'#9a7a3e',
    host:'Together with their families', line:'invite you to celebrate their wedding',
    message:'this is all for you, ily ♥', rsvp:'Kindly reply by 20 November', done:'Happily married',
    captions:['The first hello','Our first trip','Monsoon evenings','The proposal','Two families, one table','Engagement day','Laughing at nothing','Our song','Forever starts here'],
    names:['You (you walk as this avatar)','Your partner'], board:'Wishes for the couple',
    centreAct:'Admire the rings', edit:'Personalize for your wedding', aria:'Wedding invitation',
    petals:['#fdfaf4','#f6dfe0','#f1c9cf','#ead7ad'], shape:0, rug:['#7d2f33','#c9a45c'],
    deco:['#fdfaf4','#f6dfe0','#f1c9cf','#fff6ea'], tempo:0.42
  },
  birthday: {
    label:'Birthday', accent:'#b9566c', ink:'#b04a62',
    host:'You are invited to celebrate', line:'Cake, music and a room full of memories',
    message:'happy birthday, my favourite person ♥', rsvp:'Let us know you can make it by 20 November', done:'What a celebration',
    captions:['Day one','First birthday','School days','Best friends forever','That road trip','Graduation day','Adventures together','Silly faces','Here’s to many more'],
    names:['Birthday star (you walk as them)','Their favourite person'], board:'Birthday wishes',
    centreAct:'Blow out the candles', edit:'Personalize the birthday', aria:'Birthday invitation',
    petals:['#f3a8b8','#f6d47a','#94cbe6','#b4dba0'], shape:1, rug:['#c9637a','#f6d47a'],
    deco:['#f3a8b8','#f6d47a','#94cbe6','#b4dba0'], tempo:0.34
  },
  baby: {
    label:'Mother-to-be', accent:'#5f8fb5', ink:'#5a86ab',
    host:'Please join us for a baby shower honouring', line:'A little one is on the way',
    message:'can’t wait to meet you, little one ♥', rsvp:'Kindly reply by 20 November', done:'Welcome, little one',
    captions:['How we met','Our wedding day','Our first home','The big news','First scan','Bump diaries','Choosing names','Nursery ready','Hello, little one'],
    names:['Parent-to-be (you walk as them)','Partner'], board:'Wishes for the little one',
    centreAct:'Wind the mobile', edit:'Personalize the baby shower', aria:'Baby shower invitation',
    petals:['#bcd7ea','#f2c9d4','#f6e3b0','#cfe6cf'], shape:2, rug:['#9cbfd8','#f6e3b0'],
    deco:['#bcd7ea','#f2c9d4','#f6e3b0','#cfe6cf'], tempo:0.5
  }
};
const DEFAULT = {
  theme:'wedding', age:'25',
  name1:'Arjun', name2:'Meera', style1:'suit', style2:'long', color1:'#23272b', color2:'#9e2430',
  host:THEMES.wedding.host, line:THEMES.wedding.line,
  date:'2026-12-12', time:'10:30',
  venue:'Sea Breeze Gardens', city:'Fort Kochi, Kerala',
  rsvp:THEMES.wedding.rsvp, message:THEMES.wedding.message,
  photos:THEMES.wedding.captions.map(c=>({caption:c,src:null}))
};
const clone = o => JSON.parse(JSON.stringify(o));
function load(){
  try{
    const s = localStorage.getItem(STORE);
    if(s){
      const o = JSON.parse(s); const c = Object.assign(clone(DEFAULT), o);
      if(!THEMES[c.theme]) c.theme='wedding';
      c.photos = DEFAULT.photos.map((p,i)=>Object.assign({}, { caption:THEMES[c.theme].captions[i], src:null }, (o.photos||[])[i]||{}));
      return c;
    }
  }catch(e){}
  return clone(DEFAULT);
}
let cfg = load();
let storeWarn = '';
function save(){
  try{ localStorage.setItem(STORE, JSON.stringify(cfg)); storeWarn=''; }
  catch(e){
    storeWarn = 'These photos are too large to remember on this device. They stay until you close this page.';
    try{ const lite = clone(cfg); lite.photos.forEach(p=>p.src=null); localStorage.setItem(STORE, JSON.stringify(lite)); }catch(_){}
  }
}
const T = () => THEMES[cfg.theme] || THEMES.wedding;

function fmtDate(s){ const d=parseDate(s); return d? `${DAYS[d.getDay()]}, ${d.getDate()} ${MONTHS[d.getMonth()]} ${d.getFullYear()}` : ''; }

/* many small spheres in one draw call: [{p:Vector3, r:number, sy?:number}] */
function mergeSpheres(items, seg=8){
  const base=new THREE.SphereGeometry(1,seg,Math.max(4,seg*0.6|0)).toNonIndexed();
  const bp=base.attributes.position.array, bn=base.attributes.normal.array, bu=base.attributes.uv.array, n=bp.length, nu=bu.length;
  const pos=new Float32Array(n*items.length), nor=new Float32Array(n*items.length), uv=new Float32Array(nu*items.length);
  items.forEach((it,i)=>{
    const sy=it.sy||1;
    for(let j=0;j<n;j+=3){ pos[i*n+j]=bp[j]*it.r+it.p.x; pos[i*n+j+1]=bp[j+1]*it.r*sy+it.p.y; pos[i*n+j+2]=bp[j+2]*it.r+it.p.z; nor[i*n+j]=bn[j]; nor[i*n+j+1]=bn[j+1]; nor[i*n+j+2]=bn[j+2]; }

  const g=new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos,3)); g.setAttribute('normal', new THREE.BufferAttribute(nor,3)); g.setAttribute('uv', new THREE.BufferAttribute(uv,2));

}

/* collisions */
const boxes=[], circles=[];
function collide(x,z,r,self){
  if(x<-hx+r||x>hx-r||z<-hz+r||z>hz-r) return true;
  const C=window.Characters;
  if(C) for(const c of C.characters){
    if(c===self || (self && c===self.partner) || c.state==='sit' || !c.root.visible) continue;
    const dn=Math.hypot(x-c.x,z-c.z);
    if(dn<r+.26 && (!self || dn<Math.hypot(self.x-c.x,self.z-c.z))) return true;
  }
  for(const b of boxes) if(x>b[0]-r&&x<b[1]+r&&z>b[2]-r&&z<b[3]+r) return true;
  for(const c of circles) if(Math.hypot(x-c[0],z-c[1])<r+c[2]) return true;
  return false;
}

    uniforms:{ uTime:{value:0}, uCenter:{value:CENTRE.clone()}, uPal:{value:[0,1,2,3].map(()=>new THREE.Color())}, uBurst:{value:0}, uShape:{value:0} },
    vertexShader:`attribute vec4 aSeed; uniform float uTime; uniform vec3 uCenter; uniform vec3 uPal[4]; uniform float uBurst;
      varying vec2 vUv; varying vec3 vCol; varying float vFade;
      void main(){
        float top = 3.4;
        float speed = 0.16 + aSeed.y * 0.14 + uBurst * 0.5;
        float y = top - fract(aSeed.w + uTime * speed / top) * top;
        float ang = aSeed.x * 6.2832 + uTime * 0.15 * (aSeed.z - 0.5);
        float rad = 0.4 + aSeed.y * (3.0 + uBurst * 1.5);
        vec3 p = uCenter + vec3(cos(ang) * rad + sin(uTime * 0.7 + aSeed.z * 20.0) * 0.25, y, sin(ang) * rad + cos(uTime * 0.6 + aSeed.x * 17.0) * 0.25);
        vec4 mv = viewMatrix * vec4(p, 1.0);
        float rot = uTime * (0.8 + aSeed.z * 2.0) + aSeed.x * 10.0;
        float s = 0.05 + aSeed.z * 0.04;
        vec2 q = position.xy * vec2(s, s * (0.55 + 0.45 * abs(cos(rot * 0.7))));
        mv.xy += vec2(q.x * cos(rot) - q.y * sin(rot), q.x * sin(rot) + q.y * cos(rot));
        float keep = step(aSeed.w, 0.55 + uBurst * 0.45);
        vFade = keep * smoothstep(0.0, 0.4, y) * smoothstep(top, top - 0.6, y);
        vCol = uPal[int(aSeed.z * 3.99)];
        vUv = uv;
        gl_Position = projectionMatrix * mv;
      }`,
    fragmentShader:`layout(location = 0) out highp vec4 outColor; layout(location = 1) out highp vec4 outData;
      uniform float uShape; varying vec2 vUv; varying vec3 vCol; varying float vFade;
      void main(){
        vec2 c = vUv - 0.5; float a;
        if (uShape < 0.5) { float d = length(vec2(c.x, c.y * 1.5)) * 2.0; a = smoothstep(1.0, 0.8, d); }
        else if (uShape < 1.5) { a = step(abs(c.x), 0.45) * step(abs(c.y), 0.28); }
        else { float d = length(c) * 2.0; a = smoothstep(1.0, 0.9, d) * (0.2 + 0.7 * smoothstep(0.7, 0.95, d)); }
        a *= vFade;
        if (a < 0.02) discard;
        outColor = vec4(vCol * 0.95, a);
        outData = vec4(0.0);
      }`
  });
  petals=new THREE.Mesh(g, mat); petals.frustumCulled=false; petals.renderOrder=7; petals.userData.noOutline=true; scene.add(petals);
})();

/* ---------- music box (synthesised, original tune) ---------- */
const music={ctx:null, on:false, next:0, step:0, timer:null, master:null};
const NOTE = n => 440*Math.pow(2,(n-69)/12);
const TUNE = [76,79,84,79, 86,84,81,79, 76,79,81,84, 86,88,86,84, 81,84,88,84, 86,84,79,76, 77,81,84,81, 79,76,74,72];
const BASS = [48,45,41,43, 48,45,43,43];
function ensureAudio(){
  if(music.ctx) return music.ctx;
  const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return null;
  const ctx=new AC(); music.ctx=ctx;
  const master=ctx.createGain(); master.gain.value=.16;
  const delay=ctx.createDelay(); delay.delayTime.value=.31;
  const fb=ctx.createGain(); fb.gain.value=.32;
  const lp=ctx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=2600;
  master.connect(ctx.destination); master.connect(delay); delay.connect(lp); lp.connect(fb); fb.connect(delay); lp.connect(ctx.destination);
  music.master=master; return ctx;
}
function pluck(freq, t, vel=.5, dur=1.8){
  const ctx=music.ctx; if(!ctx) return;
  const g=ctx.createGain(); g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vel,t+.006); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  const o1=ctx.createOscillator(); o1.type='sine'; o1.frequency.value=freq;
  const o2=ctx.createOscillator(); o2.type='sine'; o2.frequency.value=freq*3.01;
  const g2=ctx.createGain(); g2.gain.value=.12;
  o1.connect(g); o2.connect(g2); g2.connect(g); g.connect(music.master);
  o1.start(t); o2.start(t); o1.stop(t+dur+.05); o2.stop(t+dur+.05);
}
function scheduleMusic(){
  const ctx=music.ctx, beat=T().tempo;
  while(music.next < ctx.currentTime + .5){
    const n=TUNE[music.step % TUNE.length];
    pluck(NOTE(n), music.next, .42);
    if(music.step % 4 === 0) pluck(NOTE(BASS[(music.step/4|0) % BASS.length]), music.next, .3, 2.6);
    music.next += beat; music.step++;
  }
}
function setMusic(on){
  if(on){
    const ctx=ensureAudio(); if(!ctx) return;
    ctx.resume(); music.on=true; music.next=ctx.currentTime+.08;
    clearInterval(music.timer); music.timer=setInterval(scheduleMusic,100); scheduleMusic();
  } else { music.on=false; clearInterval(music.timer); }
  const b=document.getElementById('b-music'); b.firstChild.textContent = music.on ? 'Music on ' : 'Music off '; b.setAttribute('aria-pressed', String(music.on));
}
function chime(){
  const ctx=ensureAudio(); if(!ctx) return; ctx.resume();
  const t=ctx.currentTime+.02; [84,88,91,96].forEach((n,i)=>pluck(NOTE(n), t+i*.09, .35, 1.4));
}

function toggleDance(){
  if(player.mode==='sit') stand();

  player.mode=on?'dance':'walk';
  const near=!solo() && Math.hypot(partner.x-player.x,partner.z-player.z)<3.5;

function sit(){
  if(solo()){ player.mode='sit'; player.x=BENCH_X; player.z=0; player.heading=Math.PI/2; cam.yawGoal=-Math.PI/2; cam.pitch=.22; return; }
  player.mode='sit'; partner.mode='sit';
  /* facing the screen (+x) your left is -z, so the partner sits there */
  player.x=partner.tx=BENCH_X; player.z=.27; partner.x=BENCH_X; partner.z=partner.tz=-.27;
  /* sitting close and holding hands: your left hand, their right */
  player.hold={with:partner, side:'left'}; partner.hold={with:player, side:'right'};
  player.heading=partner.heading=Math.PI/2;
  cam.yawGoal=-Math.PI/2; cam.pitch=.22;
}
function stand(){
  player.mode='walk'; partner.mode='walk';
  player.hold=null; partner.hold=null;
  player.x=BENCH_X-.75; partner.x=partner.tx=BENCH_X-.75; partner.tz=partner.z;
}

  /* facing -z your left is -x */
  if(solo()){ player.x=ARCH.x; player.z=ARCH.z-.15; player.heading=h; posing={t:0, shot:false}; cam.yawGoal=Math.PI; cam.pitch=.1; return; }
  player.x=ARCH.x+.3; player.z=ARCH.z-.15; player.heading=h;
  partner.x=partner.tx=ARCH.x-.3; partner.z=partner.tz=ARCH.z-.15; partner.heading=h; partner.faceHeading=h;
  player.hold={with:partner, side:'left'}; partner.hold={with:player, side:'right'};
  posing={t:0, shot:false};

}
