<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Immersive — Crafted for Engagement</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=Playfair+Display:ital,wght@1,400;1,700&display=swap" rel="stylesheet">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --brand-green: #4ade80;
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: #050505;
            color: white;
            overflow-x: hidden;
        }
        .font-serif {
            font-family: 'Playfair Display', serif;
        }
        /* Grainy Overlay */
        .grain::after {
            content: "";
            position: fixed;
            top: -150%; left: -150%;
            width: 300%; height: 300%;
            background-image: url("https://grainy-gradients.vercel.app/noise.svg");
            opacity: 0.04;
            pointer-events: none;
            z-index: 50;
        }
        /* Custom hide scrollbar */
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        @keyframes revealUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-reveal {
            animation: revealUp 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
        }
        
        .carousel-card {
            transition: all 0.6s cubic-bezier(0.23, 1, 0.32, 1);
        }
        
        .active-ring {
            box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.3);
        }

        /* Fluid typography for large headers to prevent mobile overflow */
        .hero-title {
            font-size: clamp(2.5rem, 10vw, 7.5rem);
        }
    </style>
</head>
<body class="grain">

    <!-- Cinematic Background -->
    <div class="fixed inset-0 z-0">
        <div class="absolute inset-0 bg-black/50 z-10"></div>
        <img id="hero-bg" src="https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&q=80&w=1200" 
             class="w-full h-full object-cover brightness-[0.5] transition-all duration-[1.5s]" alt="Background">
        <div class="absolute inset-0 bg-gradient-to-t from-black via-transparent to-black/80 z-10"></div>
    </div>

    <!-- Main Wrapper -->
    <main class="relative z-20 min-h-screen flex flex-col justify-between px-6 py-8 md:px-12 lg:px-16 md:py-12">
        
        <!-- Header -->
        <header class="flex justify-between items-center">
            <div class="flex flex-col gap-1.5">
                <span class="text-[9px] md:text-[10px] uppercase tracking-[0.5em] text-green-400 font-black">Immersive</span>
                <div class="h-[2px] w-8 bg-green-500 rounded-full"></div>
            </div>
            
            <button class="p-2.5 md:p-3 bg-white/5 backdrop-blur-2xl rounded-full border border-white/10 hover:bg-white/10 transition-all active:scale-90">
                <i data-lucide="globe" class="w-4 h-4 md:w-5 md:h-5 opacity-70"></i>
            </button>
        </header>

        <!-- Hero Content -->
        <div class="max-w-4xl mt-12 md:mt-0">
            <h1 class="flex flex-col gap-0 md:gap-2 leading-[0.9]">
                <span class="hero-title font-black tracking-tighter uppercase animate-reveal" style="animation-delay: 0.1s">Crafted for</span>
                <span class="hero-title italic font-serif opacity-90 animate-reveal" style="animation-delay: 0.3s">Engagement</span>
            </h1>
            <p class="mt-6 md:mt-8 text-sm md:text-lg lg:text-xl text-white/60 max-w-sm leading-relaxed font-light animate-reveal" style="animation-delay: 0.5s">
                Deliver unforgettable interactions with designs that pull users into your world.
            </p>
            
            <div class="mt-8 md:mt-10 animate-reveal" style="animation-delay: 0.7s">
                <button class="w-full sm:w-auto group relative px-8 py-3.5 md:py-4 rounded-full border border-green-500/40 bg-green-500/5 hover:bg-green-500/10 transition-all duration-300">
                    <span class="relative z-10 text-green-400 font-bold uppercase text-[10px] tracking-[0.3em]">Start your Free trial</span>
                    <div class="absolute inset-0 bg-green-500/10 rounded-full blur-md opacity-0 group-hover:opacity-100 transition-opacity"></div>
                </button>
            </div>
        </div>

        <!-- Bottom UI Interface -->
        <div class="flex flex-col lg:flex-row items-stretch lg:items-end justify-between gap-10 mt-16 lg:mt-auto">
            
            <!-- Socials - Optimized for Mobile wrapping -->
            <div class="flex flex-wrap gap-4 md:gap-8 text-[9px] md:text-[10px] font-bold uppercase tracking-[0.2em] text-white/30 items-center justify-center lg:justify-start">
                <a href="#" class="hover:text-white transition-colors">Facebook</a>
                <a href="#" class="hover:text-white transition-colors">Youtube</a>
                <a href="#" class="hover:text-white transition-colors">Instagram</a>
                <a href="#" class="hover:text-white transition-colors">Twitter</a>
            </div>

            <!-- Carousel & Controls Wrapper -->
            <div class="flex flex-col items-center lg:items-end gap-6 md:gap-8 w-full lg:w-auto">
                
                <!-- Cards Container - Swipable on mobile -->
                <div id="card-container" class="flex gap-4 w-full lg:w-auto overflow-x-auto lg:overflow-visible hide-scrollbar snap-x snap-mandatory px-2 lg:px-0">
                    <!-- Cards will be injected by JavaScript -->
                </div>

                <!-- Navigation Controls -->
                <div class="flex items-center justify-between w-full lg:w-auto lg:gap-20 pb-2">
                    <!-- Progress Tracker -->
                    <div class="flex items-center gap-4 md:gap-6 order-2 lg:order-1">
                        <span id="current-index" class="text-[9px] md:text-[10px] font-black text-white/20 tracking-[0.4em]">01</span>
                        <div class="w-16 md:w-20 h-[1.5px] bg-white/10 relative rounded-full overflow-hidden">
                            <div id="progress-bar" class="absolute top-0 left-0 h-full bg-green-500 transition-all duration-700 w-1/4"></div>
                        </div>
                        <span id="total-slides" class="text-[9px] md:text-[10px] font-black text-white/20 tracking-[0.4em]">04</span>
                    </div>

                    <!-- Arrows -->
                    <div class="flex gap-2.5 md:gap-3 order-1 lg:order-2">
                        <button id="prev-btn" class="w-10 h-10 md:w-12 md:h-12 rounded-full border border-white/5 bg-white/5 flex items-center justify-center hover:bg-white hover:text-black transition-all active:scale-90">
                            <i data-lucide="chevron-left" class="w-4 h-4 md:w-5 md:h-5"></i>
                        </button>
                        <button id="next-btn" class="w-10 h-10 md:w-12 md:h-12 rounded-full border border-white/5 bg-white/5 flex items-center justify-center hover:bg-white hover:text-black transition-all active:scale-90">
                            <i data-lucide="chevron-right" class="w-4 h-4 md:w-5 md:h-5"></i>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        const slides = [
            {
                id: 1,
                title: "Mountain Retreat",
                img: "https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&q=80&w=1200",
                tag: "Nature"
            },
            {
                id: 2,
                title: "Future Cities",
                img: "https://images.unsplash.com/photo-1514565131-fce0801e5785?auto=format&fit=crop&q=80&w=1200",
                tag: "Architecture"
            },
            {
                id: 3,
                title: "Nordic Design",
                img: "https://images.unsplash.com/photo-1542718610-a1d656d1884c?auto=format&fit=crop&q=80&w=1200",
                tag: "Interior"
            },
            {
                id: 4,
                title: "Coastal Escape",
                img: "https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&q=80&w=1200",
                tag: "Travel"
            }
        ];

        let activeIdx = 0;
        const total = slides.length;

        // Initialize Lucide icons
        lucide.createIcons();

        const container = document.getElementById('card-container');
        const bgImg = document.getElementById('hero-bg');
        const currentIndexLabel = document.getElementById('current-index');
        const totalSlidesLabel = document.getElementById('total-slides');
        const progressBar = document.getElementById('progress-bar');

        function updateUI() {
            // Update Background with crossfade
            bgImg.classList.add('opacity-0');
            bgImg.style.transform = 'scale(1.1)';
            setTimeout(() => {
                bgImg.src = slides[activeIdx].img;
                bgImg.classList.remove('opacity-0');
                bgImg.style.transform = 'scale(1)';
            }, 300);

            // Update Pagination Text
            currentIndexLabel.innerText = `0${activeIdx + 1}`;
            totalSlidesLabel.innerText = `0${total}`;
            
            // Update Progress Bar
            progressBar.style.width = `${((activeIdx + 1) / total) * 100}%`;

            // Render Cards
            container.innerHTML = '';
            // Show up to 3 cards
            for(let i = 0; i < 3; i++) {
                const slideIdx = (activeIdx + i) % total;
                const slide = slides[slideIdx];
                const isMain = i === 0;

                const card = document.createElement('div');
                // Responsive card sizing
                card.className = `carousel-card snap-center group relative h-44 w-36 md:h-64 md:w-52 rounded-[1.5rem] md:rounded-[2.5rem] overflow-hidden flex-shrink-0 cursor-pointer ${isMain ? 'active-ring scale-100 opacity-100' : 'opacity-40 scale-90'}`;
                
                card.innerHTML = `
                    <img src="${slide.img}" class="w-full h-full object-cover transition-transform duration-1000 group-hover:scale-110" alt="${slide.title}">
                    <div class="absolute inset-0 bg-gradient-to-t from-black/80 via-transparent to-transparent"></div>
                    <div class="absolute bottom-4 left-4 right-4 md:bottom-5 md:left-5 md:right-5">
                        <span class="text-[6px] md:text-[7px] font-bold text-green-400 uppercase tracking-widest block mb-1">${slide.tag}</span>
                        <p class="text-[9px] md:text-[10px] font-bold uppercase tracking-widest leading-tight">${slide.title}</p>
                    </div>
                `;

                if (!isMain) {
                    card.onclick = () => {
                        activeIdx = slideIdx;
                        updateUI();
                    };
                }

                container.appendChild(card);
            }
        }

        document.getElementById('next-btn').onclick = () => {
            activeIdx = (activeIdx + 1) % total;
            updateUI();
        };

        document.getElementById('prev-btn').onclick = () => {
            activeIdx = (activeIdx - 1 + total) % total;
            updateUI();
        };

        // Initial render
        updateUI();
    </script>
</body>
</html>
